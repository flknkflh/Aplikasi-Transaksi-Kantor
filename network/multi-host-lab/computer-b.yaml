# Computer B: peer0.org2.example.com only — unchanged from
# fabric-samples/test-network's own compose/compose-test-net.yaml, with ONE
# addition: extra_hosts so this machine's container can resolve
# orderer.example.com and peer0.org1.example.com to Computer A's real LAN IP.
# See ../MULTI-HOST-LAB.md.
#
#   PEER0_ORG1_HOST_IP=<computer A's LAN IP> docker compose -f computer-b.yaml up -d
name: fabric-lab-b

volumes:
  peer0.org2.example.com:

networks:
  test:
    name: fabric_test

services:
  peer0.org2.example.com:
    container_name: peer0.org2.example.com
    image: hyperledger/fabric-peer:2.5.16
    labels: { service: hyperledger-fabric }
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_lab-b_test
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org2.example.com
      - CORE_PEER_ADDRESS=peer0.org2.example.com:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.example.com:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.example.com:9051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.example.com:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org2.example.com:9445
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0org2"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
    volumes:
      - ../vendor/fabric-samples/test-network/compose/docker/peercfg:/etc/hyperledger/peercfg
      - ../vendor/fabric-samples/test-network/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com:/etc/hyperledger/fabric
      - peer0.org2.example.com:/var/hyperledger/production
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/host/var/run/docker.sock
    working_dir: /root
    command: peer node start
    ports:
      - 9051:9051
      - 9445:9445
    networks: [test]
    extra_hosts:
      - "orderer.example.com:${PEER0_ORG1_HOST_IP:?set PEER0_ORG1_HOST_IP to Computer A's LAN IP}"
      - "peer0.org1.example.com:${PEER0_ORG1_HOST_IP:?set PEER0_ORG1_HOST_IP to Computer A's LAN IP}"
